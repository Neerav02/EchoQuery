name: EchoQuery CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Fake environment variables
    env:
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_DB: "test_db"
      DATABASE_URL: "sqlite:///:memory:"
      MINIO_ROOT_USER: "test_minio"
      MINIO_ROOT_PASSWORD: "test_password"
      CELERY_BROKER_URL: "amqp://guest:guest@localhost:5672//"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      # 1. Install System Libraries (FFmpeg is needed for Whisper)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev ffmpeg

      # 2. Install Python Dependencies (Optimized)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install Testing Tools
          pip install pytest httpx pytest-mock

          # CRITICAL FIX: Install CPU-only version of PyTorch first (Small download)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu --no-cache-dir

          # Install the rest of the app requirements (ignoring the 'torch' in the file since we just installed it)
          pip install -r app/requirements.txt --no-cache-dir --prefer-binary

      # 3. Run the Tests
      - name: Run PyTest
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: |
          cd app
          pytest -v