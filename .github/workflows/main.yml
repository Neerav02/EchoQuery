name: EchoQuery CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Fake environment variables
    env:
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_DB: "test_db"
      DATABASE_URL: "sqlite:///:memory:"
      MINIO_ROOT_USER: "test_minio"
      MINIO_ROOT_PASSWORD: "test_password"
      CELERY_BROKER_URL: "amqp://guest:guest@localhost:5672//"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Dependencies (Lightweight Only)
        run: |
          python -m pip install --upgrade pip
          
          # 1. Install Testing Tools
          pip install pytest httpx pytest-mock
          
          # 2. Install API Tools MANUALLY (Skipping heavy AI libs)
          # We do NOT use requirements.txt here because it contains torch/whisper
          pip install fastapi sqlalchemy boto3 uvicorn python-multipart psycopg2-binary

      - name: Run PyTest
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: |
          cd app
          # The conftest.py we created will automatically block 'whisper' and 'transformers'
          pytest -v