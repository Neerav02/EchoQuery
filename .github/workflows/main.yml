name: EchoQuery CI Pipeline

# Trigger the pipeline on every push to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout your code onto the test machine
    - uses: actions/checkout@v3

    # 2. Set up Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3. Install Dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We install the test libraries + your app libraries
        pip install pytest httpx pytest-mock sqlalchemy fastapi boto3 uvicorn celery python-multipart psycopg2-binary

    # 4. Run the Tests
    - name: Run PyTest
      env:
        # This tells Python where to look for your 'app' folder
        PYTHONPATH: ${{ github.workspace }}/app
      run: |
        cd app
        pytest