services:
  # FastAPI Backend & Streamlit Combined Free Service
  - type: web
    name: echoquery
    env: python
    buildCommand: pip install -r frontend/requirements.txt -r app/requirements.txt
    startCommand: uvicorn app.main:app --port 8000 & streamlit run frontend/main.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_URL
        value: http://localhost:8000
