services:
  # FastAPI Backend Service
  - type: web
    name: echoquery-api
    env: python
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: echoquery-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: echoquery-redis
          property: connectionString

  # Streamlit Interactive Dashboard
  - type: web
    name: echoquery-dashboard
    env: python
    buildCommand: pip install -r frontend/requirements.txt -r app/requirements.txt
    startCommand: streamlit run frontend/main.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: echoquery-api
          property: host

  # Redis Distributed Cache & Queue Broker
  - type: redis
    name: echoquery-redis
    ipAllowList: [] # internal networking only
