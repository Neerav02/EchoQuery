services:
  # FastAPI Backend & Streamlit Combined Free Service
  - type: web
    name: echoquery
    env: python
    buildCommand: pip install -r frontend/requirements.txt -r app/requirements.txt supervisor
    startCommand: supervisord -c supervisord.conf
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_URL
        value: http://localhost:8000
